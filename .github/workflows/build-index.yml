name: Deck-Index bauen

on:
  push:
    branches:
      - main
    paths:
      - 'decks/**'
      - '!decks/index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Repo holen
        uses: actions/checkout@v4

      - name: Index schreiben
        run: node scripts/build-index.mjs

      - name: Ergebnis committen
        run: |
          if git diff --quiet -- decks/index.json; then
            echo "Keine Änderung, kein Commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decks/index.json
          git commit -m "decks/index.json aktualisiert"
          git push
